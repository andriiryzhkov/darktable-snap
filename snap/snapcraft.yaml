name: darktable
adopt-info: darktable

grade: stable
confinement: strict
base: core24
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  darktable:
    command: usr/bin/darktable --datadir $SNAP/usr/share/darktable --moduledir $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/darktable --configdir $SNAP_USER_DATA --localedir $SNAP/usr/share/locale
    extensions: [gnome]
    environment:
      GTK_USE_PORTAL: 0
    plugs:
      - opengl
      - home
      - removable-media
      - password-manager-service
      - network
      - network-bind
      - network-status
  cli:
    command: usr/bin/darktable-cli --datadir $SNAP/usr/share/darktable --moduledir $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/darktable --configdir $SNAP_USER_DATA --localedir $SNAP/usr/share/locale
    extensions: [gnome]
    environment:
      GTK_USE_PORTAL: 0
    plugs:
      - opengl
      - home
      - removable-media
      - password-manager-service
      - network
      - network-bind

  lesfun-update-data:
    command: usr/bin/lensfun-update-data
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
    plugs:
      - network

slots:
    session-dbus-interface:
        interface: dbus
        name: org.darktable.service
        bus: session

layout:
  /usr/include/clc:
    bind: $SNAP/usr/include/clc
  /usr/lib/clc:
    bind: $SNAP/usr/lib/clc
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gallium-pipe:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gallium-pipe
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl
  /usr/share/git-core/templates:
    bind: $SNAP/usr/share/git-core/templates

build-packages:
    - gcc-12
    - g++-12

parts:
    opencl:
        plugin: nil
        stage-packages:
            - mesa-opencl-icd
            - ocl-icd-libopencl1
            - on amd64:
                - intel-opencl-icd
    darktable:
        plugin: cmake
        source: https://github.com/darktable-org/darktable.git
        source-tag: release-5.6.2
        cmake-parameters:
            - -DCMAKE_BUILD_TYPE=RelWithDebInfo
            # the patches below leave the tree modified, so git describe would say
            # 5.6.2+dirty. Keep in sync with source-tag
            - -DPROJECT_VERSION=5.6.2
            # Place the data alongside that coming from stage-packages (e.g. the lensfun database)
            - -DCMAKE_INSTALL_PREFIX=/usr
            # Support Lua scripts by way of internal Lua implementation
            - -DDONT_USE_INTERNAL_LUA=OFF
            # Don't overly optimize for build CPU-- stay generic
            - -DBINARY_PACKAGE_BUILD=ON
            - -DCMAKE_INCLUDE_SYSTEM_FLAG_C="isystem"
            - -DCMAKE_INCLUDE_SYSTEM_FLAG_CXX="isystem"
            - -DCMAKE_SYSTEM_PREFIX_PATH="${CRAFT_STAGE}/usr;/snap/gnome-46-2404-sdk/current/usr/;/usr"
            - -DCMAKE_VERBOSE_MAKEFILE=ON
            - -DCMAKE_CXX_FLAGS="-Wno-deprecated-register"
            - -DUSE_COLORD=ON
            # AI features, with ONNX Runtime from the onnxruntime part; never download it
            - -DUSE_AI=ON
            - -DONNXRUNTIME_OFFLINE=ON
            # only lut3d's compressed .gmz LUTs use G'MIC, and since 5.6 a missing
            # G'MIC fails the configure instead of being skipped
            - -DUSE_GMIC=OFF
        parse-info:
          - usr/share/metainfo/org.darktable.darktable.appdata.xml
        stage-packages:
            - git
            - libarchive13t64
            - libasn1-8-heimdal
            - libavif16
            - libcurl3-gnutls
            - libexiv2-27
            - libgraphicsmagick-q16-3
            - libgssapi3-heimdal
            - libheif1
            - libhcrypto5t64-heimdal
            - libheimbase1-heimdal
            - libheimntlm0-heimdal
            - libhx509-5-heimdal
            - libimage-exiftool-perl
            - libkrb5-26-heimdal
            - libgphoto2-6
            - libldap2
            - liblensfun-bin
            - liblensfun-data-v1
            - liblensfun1
            - libnghttp2-14
            - libopenexr-3-1-30
            - libpotrace0
            - libpugixml1v5
            - libroken19t64-heimdal
            - librtmp1
            - libsasl2-2
            - libssh-4
            - libwind0-heimdal
        build-packages:
            - intltool
            - libarchive-dev
            - libavif-dev
            - libexiv2-dev
            - libgraphicsmagick1-dev
            - libheif-dev
            - liblensfun-dev
            - libgphoto2-dev
            - libopenexr-dev
            - libpotrace-dev
            - libpugixml-dev
            - libsdl2-dev
            - libsm-dev
            - libxml2-utils
            - libxrandr-dev
            - ninja-build
            - patch
            - pkg-config
            - xsltproc

        build-environment:
            - LDFLAGS: "-L${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR} $(pkg-config --libs sdl2 harfbuzz gtk+-3.0 OpenEXR)"
            - CFLAGS: "-O3"
            - CXXFLAGS: "-O3"

        override-pull: |
          craftctl default
          craftctl set version=$(git describe --always | sed -e 's/^release-//;s/-/+git/;y/-/./')
          patch -p0 < "${CRAFT_PROJECT_DIR}/snap/local/patches/darktable-math_h.patch"
          patch -p0 < "${CRAFT_PROJECT_DIR}/snap/local/patches/darktable-dttypes_h.patch"
        override-build: |
          # FindONNXRuntime.cmake takes a copy in the build tree, where its own
          # download would land, and install puts the library in the module
          # directory. Not src/external: the module patches ORT's cmake files and
          # darktable sets CMAKE_DISABLE_SOURCE_CHANGES
          rm -rf "${CRAFT_PART_BUILD_WORK}/_deps/onnxruntime"
          mkdir -p "${CRAFT_PART_BUILD_WORK}/_deps"
          cp -a "${CRAFT_STAGE}/onnxruntime" "${CRAFT_PART_BUILD_WORK}/_deps/onnxruntime"
          craftctl default
          PYTHONPATH=${CRAFT_PART_INSTALL}/usr/lib/python3/dist-packages ${CRAFT_PART_INSTALL}/usr/bin/lensfun-update-data || echo No updates
          if [ -d /var/lib/lensfun-updates/version_1/ ]; then
            cp /var/lib/lensfun-updates/version_1/* ${CRAFT_PART_INSTALL}/usr/share/lensfun/version_1/
          fi
        after:
            - onnxruntime
            - osmgpsmap
            - colord

    onnxruntime:
        # Prebuilt ONNX Runtime for darktable's AI features: noble has no package.
        # Checked here because source-checksum cannot vary by architecture.
        plugin: nil
        build-packages:
            - curl
        override-pull: |
          version=1.29.1
          case "${CRAFT_ARCH_BUILD_FOR}" in
            amd64)
              pkg="onnxruntime-linux-x64-${version}.tgz"
              sha256=a28d7d65acafc06fb0f416cb409998773f5314c7eebf77caf907812831cdfc67 ;;
            arm64)
              pkg="onnxruntime-linux-aarch64-${version}.tgz"
              sha256=e53fc0cfb72e505031e06e13c651c1cb78424f39f15d304f47a3d5b907bcf9f2 ;;
            *)
              echo "no ONNX Runtime package for ${CRAFT_ARCH_BUILD_FOR}" >&2
              exit 1 ;;
          esac
          cd "${CRAFT_PART_SRC}"
          curl -fsSL -o "${pkg}" "https://github.com/microsoft/onnxruntime/releases/download/v${version}/${pkg}"
          echo "${sha256}  ${pkg}" | sha256sum -c -
          tar -xzf "${pkg}" --strip-components=1
          rm "${pkg}"
        override-build: |
          mkdir -p "${CRAFT_PART_INSTALL}/onnxruntime"
          cp -a "${CRAFT_PART_SRC}/include" "${CRAFT_PART_SRC}/lib" "${CRAFT_PART_INSTALL}/onnxruntime/"
        # build input only: darktable installs the library it needs
        prime:
            - -onnxruntime

    colord:
      source: https://www.freedesktop.org/software/colord/releases/colord-gtk-0.3.0.tar.xz
      source-checksum: sha256/b9466656d66d9a6ffbc2dd04fa91c8f6af516bf9efaacb69744eec0f56f3c1d0
      plugin: meson
      meson-parameters:
        - --prefix=/usr
        - -Dman=false
        - -Ddocs=false
      build-packages:
        - meson
        - libcolord-dev

    osmgpsmap:
        source: https://github.com/nzjrs/osm-gps-map/releases/download/1.2.0/osm-gps-map-1.2.0.tar.gz
        source-checksum: sha256/ddec11449f37b5dffb4bca134d024623897c6140af1f9981a8acc512dbf6a7a5
        plugin: autotools
        autotools-configure-parameters:
            - --prefix=/usr
            - --enable-introspection=no
        stage-packages:
            - libsoup-2.4-1
        build-packages:
            - libcurl4-gnutls-dev
            - libssl-dev
            - libsoup2.4-dev
        build-environment:
            - CFLAGS: "-O3"
            - CXXFLAGS: "-O3"
